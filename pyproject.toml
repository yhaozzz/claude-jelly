[project]
name = "claude-jelly"
version = "1.3.0"
description = "桌面悬浮小水母：一键打开 / 收起运行 Claude Code 的 Windows Terminal"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "yh_ao" }]
keywords = ["claude", "claude-code", "windows", "desktop-widget", "deepseek"]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.gui-scripts]
claude-jelly = "claude_jelly.__main__:_run"

[project.scripts]
claude-jelly-preview = "claude_jelly.app:preview_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_jelly"]

[dependency-groups]
dev = ["ruff>=0.6"]
